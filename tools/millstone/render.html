function makeNoise(seed) {

// Hairline cracks that start at the rim and wander inward.

function crackDist(c, x, y) {

// Separable box blur, used to find recesses (dirt) and raised edges (wear).

      tmp[row + x] = acc / n;
      acc += src[row + Math.min(S - 1, x + rad + 1)] - src[row + Math.max(0, x - rad)];

  for (let x = 0; x < S; x++) {
    let acc = 0;
    for (let y = -rad; y <= rad; y++) acc += tmp[Math.min(S - 1, Math.max(0, y)) * S + x];

function render(S, o) {

      const mott = 0.4 * fbm(nA, x * 1.6 + 3, y * 1.6 + 5, 3) + 0.35 * fbm(nA, x * 3.2 + 9, y * 3.2 - 2, 4) + 0.25 * fbm(nF, x * 11 + 4, y * 11 - 7, 3);
      cr += 30 * mott; cg += 26 * mott; cb += 18 * mott;
      const stain = smooth(-0.04, 0.34, fbm(nB, x * 2.1 - 5, y * 2.1 + 8, 4)) * wx;                  // rust and water stains
      cr = mix(cr, 150, stain * 0.5); cg = mix(cg, 86, stain * 0.5); cb = mix(cb, 48, stain * 0.5);
      const streak = smooth(0.18, 0.42, fbm(nI, x * 14 + 2, y * 1.8 - 3, 3)) * wx;                  // run-off streaks
      cr = mix(cr, 120, streak * 0.3); cg = mix(cg, 82, streak * 0.3); cb = mix(cb, 56, streak * 0.3);
      const near = Math.min(1, smooth(0.78, 0.995, r) + smooth(G.rEye + 0.16, G.rEye, r));
      const grime = near * (0.5 + 0.5 * (0.5 + 0.5 * nE(x * 6, y * 6))) * wx;                         // grime at the rim and eye
      cr = mix(cr, 104, grime * 0.55); cg = mix(cg, 66, grime * 0.55); cb = mix(cb, 42, grime * 0.55);
      const bleach = smooth(0.04, 0.4, fbm(nE, x * 2.6 + 11, y * 2.6 - 9, 4)) * wx;                 // sun-faded patches
      cr = mix(cr, 236, bleach * 0.3); cg = mix(cg, 212, bleach * 0.3); cb = mix(cb, 174, bleach * 0.3);
      const lich = smooth(0.26, 0.42, fbm(nG, x * 6.5 + 3, y * 6.5 + 8, 3)) * wx;                     // grey-green lichen crusts
      const crust = lich * (0.6 + 0.4 * smooth(-0.2, 0.4, nI(x * 40, y * 40)));
      cr = mix(cr, 156, crust * 0.7); cg = mix(cg, 156, crust * 0.7); cb = mix(cb, 132, crust * 0.7);
      const pale = smooth(0.34, 0.46, fbm(nH, x * 9 - 4, y * 9 + 2, 3)) * wx;                         // pale crusty lichen
      cr = mix(cr, 222, pale * 0.6); cg = mix(cg, 216, pale * 0.6); cb = mix(cb, 196, pale * 0.6);
      const spots = smooth(0.5, 0.62, nH(x * 30 + 1, y * 30 - 2)) * wx;                               // dark lichen spots

      cr = mix(cr, 238, SPL[i] * 0.22); cg = mix(cg, 196, SPL[i] * 0.22); cb = mix(cb, 140, SPL[i] * 0.22);   // fresher stone where it flaked

      img.data[j + 2] = Math.max(0, Math.min(255, cb * shade));
      img.data[j + 3] = Math.round(a * 255);

const t0 = performance.now();
const big = render(1440, { cracks: false });
document.getElementById('out-big').textContent = big.toDataURL('image/webp', 0.86);
const mark = render(256, { w: 0.045, depth: 0.02, ao: 0.4, dirt: 0.3, speck: 0.3, grain: 0.0012, weather: 0.7, cracks: false, relief: 1.1 });
